<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7E7CE" />
    <meta name="robots" content="index, follow" />

    <!-- The example.com URLs below are placeholders: server/_core/seo.ts rewrites the canonical,
         Open Graph, Twitter, and JSON-LD URLs with the real request origin on every page load. -->
    <link rel="canonical" href="https://example.com/" />

    <title>Ziad Hossam | Full-Stack Developer & AI Engineer</title>
    <meta name="description" content="Ziad Hossam is a full-stack developer studying AI engineering. He builds websites, web applications, and AI-driven tools." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ziad Hossam" />
    <meta property="og:title" content="Ziad Hossam | Full-Stack Developer & AI Engineer" />
    <meta property="og:description" content="Ziad Hossam is a full-stack developer studying AI engineering. He builds websites, web applications, and AI-driven tools." />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="https://example.com/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ziad Hossam | Full-Stack Developer & AI Engineer" />
    <meta name="twitter:description" content="Ziad Hossam is a full-stack developer studying AI engineering. He builds websites, web applications, and AI-driven tools." />
    <meta name="twitter:image" content="https://example.com/images/og-image.jpg" />

    <link rel="preload" as="image" media="(min-width: 851px)" href="/images/profile-ziad-portrait-1200.webp" imagesrcset="/images/profile-ziad-portrait-720.webp 720w, /images/profile-ziad-portrait-1200.webp 1200w" imagesizes="(max-width: 850px) 78vw, 440px" fetchpriority="high" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ziad Hossam",
        "jobTitle": "Full-Stack Developer",
        "url": "https://example.com/",
        "sameAs": ["https://github.com/engziadhossam157-bit"],
        "address": { "@type": "PostalAddress", "addressLocality": "Cairo", "addressCountry": "EG" },
        "description": "Full-stack developer studying AI engineering. Builds websites, web applications, and AI-driven tools."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
